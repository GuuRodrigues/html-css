<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Forms & validation</title>
</head>
<body>
    <div class="container">
        <section class="header">
            <h2>Nova Conta</h2>
        </section>
        <form id="form" class="form">
            <div class="form-content">
                <label for="username">Nome do Usuário</label>
                <input type="text" id="username" placeholder="Digite o nome do usuário...">
                <a>Aqui vai a mensagem de erro...</a>
            </div>

            <div class="form-content">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Digite o email do usuário...">
                <a>Aqui vai a mensagem de erro...</a>
            </div>

            <div class="form-content">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite a senha do usuário...">
                <a>Aqui vai a mensagem de erro...</a>
            </div>

            <div class="form-content">
                <label for="senha-confirmada">Confirmação de Senha</label>
                <input type="password" id="senha-confirmada" placeholder="Confirme a senha do usuário...">
                <a>Aqui vai a mensagem de erro...</a>
            </div>

            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
